<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слово за словом</title>
<style>
:root{--bg:#f4f1fb;--card:#fff;--text:#1f1b2e;--muted:#6b6683;--accent:#6d4aff;--accent2:#c04aff;--ok:#16a36a;--bad:#e5484d;--line:#e4dff5;--fire:#ff7a1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111f;--card:#1e1a2e;--text:#f1eefc;--muted:#a49fc0;--accent:#8b72ff;--accent2:#d36bff;--ok:#38d695;--bad:#ff6b70;--line:#332d4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111f;--card:#1e1a2e;--text:#f1eefc;--muted:#a49fc0;--accent:#8b72ff;--accent2:#d36bff;--ok:#38d695;--bad:#ff6b70;--line:#332d4d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:18px 16px 40px}
.app{width:100%;max-width:540px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.stats{display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text)}
.fire{font-size:18px;font-weight:700;color:var(--fire);border-color:color-mix(in srgb,var(--fire) 45%,transparent);background:color-mix(in srgb,var(--fire) 10%,var(--card));padding:5px 13px}
.fire.off{filter:grayscale(1);opacity:.55;color:var(--muted)}
.fire.pop{animation:pop .45s}
@keyframes pop{30%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.lbl{font-size:12px;color:var(--muted);margin:6px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 22px;margin-top:14px;box-shadow:0 20px 50px -25px color-mix(in srgb,var(--accent) 60%,transparent)}
.card{transition:background .25s,border-color .25s,box-shadow .25s}
.card.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.card.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 30%,transparent);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tags{display:flex;gap:6px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 10px;border-radius:999px}
.word{font-size:clamp(32px,9vw,46px);font-weight:700;margin:16px 0 6px;letter-spacing:-.02em;word-break:break-word}
.def{color:var(--muted);min-height:22px;font-size:15px;line-height:1.45}
input[type=text]{width:100%;padding:14px 15px;font:inherit;font-size:17px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
#ans{margin-top:20px;font-size:18px}
input.ok{border-color:var(--ok)}input.bad{border-color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
button.b{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b:disabled{opacity:.5;cursor:default}
button.main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;font-weight:600}
.res{margin-top:14px;padding:13px;border-radius:14px;font-size:15px;line-height:1.5;display:none}
.res.show{display:block}
.res.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.res.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.res span{color:var(--text)}
.panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:none}
.panel.show{display:block}
.panel h2{font-size:15px;margin:0 0 10px}
.panel input[type=text]{margin-bottom:8px;font-size:15px;padding:11px 13px}
.list{margin-top:12px;max-height:220px;overflow-y:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.item small{color:var(--muted)}
.item button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.bar{height:5px;border-radius:3px;background:var(--line);margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer;color:var(--text)}
.spk:hover{border-color:var(--accent)}
select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;margin-bottom:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Слово за словом</h1>
  <div class="stats">
    <div class="chip fire off" id="fire">🔥 <span id="streak">0</span></div>
    <div class="chip">рекорд <b id="best">0</b></div>
    <div class="chip"><b id="score">0</b>/<b id="total">0</b></div><button class="chip" id="gear" title="Настройки" style="cursor:pointer;font-size:16px">⚙️</button>
  </div>
</header>
<div class="panel" id="sp"><h2>Настройки</h2>
<div class="lbl">Голос</div><select id="vo"></select>
<div class="lbl">Звуки</div><select id="sf"></select>
<button class="b" id="rs" style="width:100%;margin-top:4px">Сбросить статистику слов</button>
<button class="b" id="cd" style="width:100%;margin-top:8px">Очистить весь словарь</button>
<button class="b" id="bk" style="width:100%;margin-top:8px">Резервная копия / восстановление</button>
<div id="bkb" class="hide"><textarea id="bt" rows="4" style="width:100%;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px;font-size:12px"></textarea><div class="row"><button class="b" id="bc">Скопировать</button><button class="b main" id="br">Восстановить из текста</button></div></div></div>
<div class="seg"><button id="t1" class="on">🎲 Случайные</button><button id="t2">📒 Словарь</button></div>
<div class="seg"><button id="d1" class="on">EN → RU</button><button id="d2">RU → EN</button></div>

<div id="lvbox"><div class="lbl">Уровень английского (удерживайте и проведите пальцем, чтобы выбрать несколько)</div>
<div class="seg" id="lv"></div></div>

<div class="card">
  <div class="tags"><span class="tag" id="pos"></span><span class="tag" id="lvtag"></span></div>
  <div class="wrow"><div class="word" id="word"></div><button class="spk" id="spk" title="Произнести">🔊</button></div>
  <div class="def" id="def"></div>
  <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row"><button class="b" id="back">← Назад</button><button class="b" id="hint">Подсказка</button><button class="b" id="skip">Пропустить</button></div>
  <div class="row"><button class="b main" id="go">Проверить</button></div>
  <div class="row"><button class="b hide" id="addd">＋ Добавить в мой словарь</button></div>
  <div class="res" id="res"></div>
</div>

<div class="panel" id="dp">
  <div class="lbl hide" id="warn" style="color:var(--bad)">⚠ Браузер не сохраняет данные (режим инкогнито или запрет). Делайте резервную копию.</div><h2>Добавить слово</h2>
  <input type="text" id="nw" placeholder="Слово (English)" autocapitalize="off">
  <input type="text" id="nt" placeholder="Перевод (несколько через запятую)">
  
  <button class="b main" id="add" style="width:100%">Добавить</button>
  <button class="b" id="tl" style="width:100%;margin-top:10px">Показать список</button>
  
  
  
  <div class="list hide" id="list"></div>
</div>
</div>
<script>
const L=["A1","A2","B1","B2","C1","C2"];
const RAW=[
["apple|яблоко|noun|a round red or green fruit","house|дом|noun|a building where people live","friend|друг,подруга|noun|a person you like and know well","water|вода|noun|a clear liquid we drink","happy|счастливый,радостный|adj|feeling good and pleased","big|большой,крупный|adj|large in size","book|книга|noun|pages with words, bound together","morning|утро|noun|the early part of the day","family|семья|noun|parents, children and relatives","eat|есть,кушать|verb|to put food in your mouth and swallow"],
["borrow|занимать,брать взаймы|verb|to take something and give it back later","ticket|билет|noun|paper that lets you travel or enter a place","weather|погода|noun|rain, sun, wind and temperature","neighbour|сосед,соседка|noun|a person who lives next to you","improve|улучшать,улучшаться|verb|to become or make better","healthy|здоровый,полезный|adj|good for your body","invite|приглашать|verb|to ask someone to come to an event","explain|объяснять|verb|to make something clear to someone","crowded|многолюдный,переполненный|adj|full of people","delay|задержка,задерживать|noun|a time when something happens later than planned"],
["achieve|достигать,добиваться|verb|to succeed in doing something with effort","opportunity|возможность,шанс|noun|a chance to do something good","environment|окружающая среда,среда|noun|the natural world or surroundings","challenge|вызов,проблема|noun|something difficult that tests you","reliable|надежный|adj|able to be trusted","suggest|предлагать,советовать|verb|to put forward an idea","afford|позволить себе|verb|to have enough money for something","avoid|избегать|verb|to keep away from something","deadline|крайний срок,дедлайн|noun|the last time something can be finished","behave|вести себя|verb|to act in a particular way"],
["reluctant|неохотный,нерешительный|adj|unwilling and hesitant","thrive|процветать,преуспевать|verb|to grow or develop very well","consequence|последствие|noun|a result of an action","sustainable|устойчивый,экологичный|adj|able to continue without harming resources","assume|предполагать|verb|to accept something as true without proof","overcome|преодолевать|verb|to succeed in dealing with a problem","controversial|спорный|adj|causing strong disagreement","implement|внедрять,реализовывать|verb|to put a plan into action","outcome|результат,исход|noun|the final result of something","hesitate|колебаться,мяться|verb|to pause before doing something"],
["ubiquitous|вездесущий,повсеместный|adj|found everywhere","meticulous|дотошный,скрупулезный|adj|showing great attention to detail","ephemeral|недолговечный,мимолетный,эфемерный|adj|lasting a very short time","scrutinize|тщательно изучать|verb|to examine very carefully","mitigate|смягчать,уменьшать|verb|to make something less severe","pragmatic|прагматичный|adj|dealing with things in a practical way","ambiguous|двусмысленный,неоднозначный|adj|having more than one possible meaning","elaborate|разрабатывать,подробный|adj|detailed and carefully planned","comprehensive|всесторонний,исчерпывающий|adj|including everything that is needed","resilient|стойкий,жизнестойкий,устойчивый|adj|able to recover quickly from difficulties"],
["quintessential|типичный,классический|adj|the most perfect example of something","surreptitious|тайный,скрытый|adj|done secretly to avoid notice","obfuscate|запутывать,затуманивать|verb|to make something unclear on purpose","ameliorate|улучшать|verb|to make a bad situation better","serendipity|счастливая случайность,удача|noun|a pleasant discovery made by chance","loquacious|болтливый,разговорчивый|adj|tending to talk a great deal","perfunctory|поверхностный,формальный|adj|done with little effort or interest","ostensible|мнимый,кажущийся|adj|appearing to be true but perhaps not","magnanimous|великодушный|adj|generous and forgiving","vicarious|косвенный,пережитый через других|adj|experienced through another person"]];
const BUILT=[];RAW.forEach((a,i)=>a.forEach(s=>{const p=s.split("|");BUILT.push({k:"b:"+p[0],en:p[0],ru:p[1].split(","),pos:p[2],def:p[3],lv:i})}));
const $=id=>document.getElementById(id);
let S={wt:{},dict:[],best:0,lvl:1,st:{},m:[{},{},{}]};
try{const x=JSON.parse(localStorage.getItem("wst2")||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{Object.assign(S.m[tab],{streak,score,total});localStorage.setItem("wst2",JSON.stringify(S))}catch(e){}};
let tab=0,dir=0,cur=null,hist=[],fwd=[],done=false,hinted=0,streak=0,score=0,total=0,count=0,lastK="",queue=[];
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я\s-]/g,"").replace(/\s+/g," ").trim().replace(/^to (?=\S)/,"");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
const tol=n=>n.length>=9?2:n.length>=5?1:0;
const dictItems=()=>S.dict.map(w=>({k:"u:"+w.en,en:w.en,ru:w.ru,pos:"мой",def:"",lv:-1}));
const M=()=>S.m[tab];
function other(v){const w=[...dictItems(),...BUILT].find(w=>w.k!==cur.k&&(dir===0?w.ru.some(r=>norm(r)===v):norm(w.en)===v));if(!w)return"";const t=esc($("ans").value.trim());return dir===0?'<br><span>«'+t+'» — это перевод слова «'+esc(w.en)+'»</span>':'<br><span>«'+t+'» — это «'+esc(w.ru.join(", "))+'»</span>'}
const pool=()=>tab===0?BUILT.filter(w=>S.lvls.includes(w.lv)):dictItems();
function weight(w){return Math.min(2.2,Math.max(.7,S.wt[w.k]??1))}
function pick(){
  const P=pool();if(!P.length)return null;
  const q=queue.find(x=>x.due<=count&&P.some(w=>w.k===x.k)&&x.k!==lastK);
  if(q)return P.find(w=>w.k===q.k);
  const C=P.length>1?P.filter(w=>w.k!==lastK):P;
  let r=Math.random()*C.reduce((s,w)=>s+weight(w),0);
  for(const w of C){r-=weight(w);if(r<=0)return w}return C[0];
}
function next(){
  count++;if(cur)hist.push(cur);if(hist.length>40)hist.shift();cur=fwd.length?fwd.pop():pick();render()}
function back(){if(!hist.length)return;if(cur)fwd.push(cur);cur=hist.pop();render()}
function reset(){hist=[];fwd=[];cur=null}
function render(){
  done=false;hinted=0;$("back").disabled=!hist.length;
  $("res").className="res";document.querySelector(".card").className="card";$("addd").classList.add("hide");
  $("ans").value="";$("ans").className="";
  const empty=!cur;
  ["ans","go","hint","skip"].forEach(i=>$(i).disabled=empty);
  if(empty){$("word").textContent="Словарь пуст";$("def").textContent="Добавьте слова на вкладке «Словарь» — и я начну их спрашивать.";$("pos").textContent="";$("lvtag").textContent="";return}
  lastK=cur.k;
  $("pos").textContent=cur.pos;$("lvtag").textContent=cur.lv>=0?L[cur.lv]:"";$("lvtag").classList.toggle("hide",cur.lv<0);
  $("word").textContent=cap(dir===0?cur.en:cur.ru.join(", "));
  $("def").textContent=cur.def?"Значение: "+cur.def:"";
  $("ans").placeholder=dir===0?"Введите перевод…":"Type the English word…";
  $("go").textContent="Проверить";$("ans").focus();
}
const answers=()=>dir===1?[cur.en]:cur.ru;
function fire(){const f=$("fire");$("streak").textContent=streak;$("best").textContent=M().best||0;f.classList.toggle("off",streak===0);
  if(streak>0){f.classList.remove("pop");void f.offsetWidth;f.classList.add("pop")}
  $("score").textContent=score;$("total").textContent=total;renderList()}
function rec(ok){const s=S.st[cur.k]||(S.st[cur.k]={r:0,w:0,run:0});if(ok){s.r++;s.run++}else{s.w++;s.run=0}}
function miss(){streak=0;rec(false);S.wt[cur.k]=Math.min(2.2,(S.wt[cur.k]??1)+.6);
  if(!queue.some(x=>x.k===cur.k))queue.push({k:cur.k,due:count+3});save();fire()}
function check(){
  if(done){next();return}
  const v=norm($("ans").value);if(!v)return;
  const exact=answers().some(a=>norm(a)===v);const ok=exact||answers().some(a=>{const n=norm(a);return tol(n)>0&&lev(n,v)<=tol(n)});const typo=ok&&!exact;
  done=true;total++;$("ans").disabled=true;
  const all=answers().join(", ");
  if(ok){score++;streak++;rec(true);if(streak>(M().best||0))M().best=streak;S.wt[cur.k]=Math.max(.7,(S.wt[cur.k]??1)*.85);queue=queue.filter(x=>x.k!==cur.k);save();fire();
    $("ans").className="ok";document.querySelector(".card").className="card ok";$("res").className="res show ok";$("res").innerHTML=(typo?"Засчитано — опечатка! ":"Верно! ")+"<span>"+(typo?"Правильно: ":"Все варианты: ")+all+"</span>"}
  else{miss();$("ans").className="bad";document.querySelector(".card").className="card bad";$("res").className="res show bad";$("res").innerHTML="Не совсем. <span>Правильно: "+all+" — слово скоро вернётся</span>"+other(v)}
  $("go").textContent="Дальше →";ding(ok);
  if(tab===0&&!S.dict.some(w=>w.en===cur.en))$("addd").classList.remove("hide");
}
$("go").onclick=check;$("back").onclick=back;
const FEM=/female|sonia|libby|maisie|hazel|susan|serena|kate|martha|stephanie|fiona|moira|karen|samantha|victoria|zira|catherine|amy|emma|olivia|lucy|tessa|milena|katya|irina|svetlana|alena|tatyana|google русский/i,MALE=/\bmale\b|daniel|george|ryan|thomas|oliver|arthur|rishi|james|guy|david|mark|fred|alex|pavel|yuri|maxim|dmitry|aaron|ralph/i;
function sc(v,lang){const n=v.name;let s=0;if(v.lang.replace('_','-').toLowerCase()===lang.toLowerCase())s+=50;if(/natural|neural|online|premium|enhanced|siri/i.test(n))s+=30;if(FEM.test(n))s+=40;if(MALE.test(n))s-=60;return s}
function best(lang){const p=lang.slice(0,2).toLowerCase();const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(p));if(p==='en'&&S.voice){const m=vs.find(v=>v.name===S.voice);if(m)return m}return vs.sort((a,b)=>sc(b,lang)-sc(a,lang))[0]}
function say(t,lang){try{const ss=window.speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.92;const v=best(lang);if(v){u.voice=v;u.lang=v.lang}ss.speak(u)}catch(e){}}
function fillVo(){if(!window.speechSynthesis){$("vo").classList.add("hide");return}const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>sc(b,"en-GB")-sc(a,"en-GB"));$("vo").innerHTML='<option value="">🔊 Голос: авто (лучший женский)</option>'+vs.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+' ('+v.lang+')</option>').join("");$("vo").value=vs.some(v=>v.name===S.voice)?S.voice:""}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVo;
$("vo").onchange=()=>{S.voice=$("vo").value;save()};
$("spk").onclick=()=>{if(!cur)return;done?say(cur.en,"en-GB"):say($("word").textContent,dir===0?"en-GB":"ru-RU")};
if(!window.speechSynthesis)$("spk").classList.add("hide");
let AC=null;
function tone(f,t0,d,type,vol){const c=AC,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}
const SFX={classic:{ok:[[659,0,.35,'sine',.18],[880,.1,.35,'sine',.18],[1319,.2,.6,'sine',.16]],bad:[[196,0,.25,'triangle',.22],[147,.14,.45,'triangle',.22]]},
bell:{ok:[[1047,0,.9,'sine',.18],[2093,0,.5,'sine',.05],[1568,.12,1,'sine',.14]],bad:[[220,0,.7,'sine',.22],[233,0,.7,'sine',.15]]},
arcade:{ok:[[988,0,.08,'square',.07],[1319,.08,.35,'square',.07]],bad:[[220,0,.12,'sawtooth',.09],[165,.12,.12,'sawtooth',.09],[110,.24,.3,'sawtooth',.09]]},
soft:{ok:[[523,0,.3,'triangle',.2],[659,.12,.3,'triangle',.2],[784,.24,.5,'triangle',.2]],bad:[[330,0,.3,'sine',.2],[262,.18,.5,'sine',.2]]}};
const skey=()=>S.sfx===false||S.sfx==='off'?'off':SFX[S.sfx]?S.sfx:'classic';
function ding(ok){try{const th=SFX[skey()];if(!th)return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();th[ok?'ok':'bad'].forEach(a=>tone(...a))}catch(e){}}
const SN={off:"🔇 Звуки: выкл",classic:"🔔 Звуки: классика",bell:"🔔 Звуки: колокольчик",arcade:"🔔 Звуки: аркада",soft:"🔔 Звуки: мягкие"};
$("sf").innerHTML=Object.keys(SN).map(k=>'<option value="'+k+'">'+SN[k]+'</option>').join("");
$("sf").value=skey();
$("sf").onchange=()=>{S.sfx=$("sf").value;save();ding(true);setTimeout(()=>ding(false),1000)};
let rsT=null;
$("rs").onclick=()=>{const L0="Сбросить статистику слов";if(!rsT){$("rs").textContent="Точно сбросить? Нажмите ещё раз";rsT=setTimeout(()=>{rsT=null;$("rs").textContent=L0},3500);return}clearTimeout(rsT);rsT=null;$("rs").textContent=L0;S.st={};S.wt={};queue=[];save();renderList()};
$("skip").onclick=()=>{if(!cur)return;if(!done){total++;miss()}next()};
$("hint").onclick=()=>{if(done||!cur)return;hinted++;const a=answers()[0];$("def").textContent=(cur.def?"Значение: "+cur.def+" · ":"")+"Подсказка: "+a.slice(0,hinted)+(a.length>hinted?"…":"");$("ans").focus()};
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&done&&document.activeElement!==$("ans"))check()});
$("addd").onclick=()=>{S.dict.push({en:cur.en,ru:cur.ru});save();$("addd").classList.add("hide");renderList()};
function renderList(){
  const acc=s=>s&&s.r+s.w?s.r/(s.r+s.w):2;
  const R=S.dict.reduce((a,w)=>a+(S.st["u:"+w.en]?.r||0),0),Wr=S.dict.reduce((a,w)=>a+(S.st["u:"+w.en]?.w||0),0);
  $("list").innerHTML='<div class="lbl">Слов: '+S.dict.length+(R+Wr?' · точность: '+Math.round(R/(R+Wr)*100)+'%':'')+' · сначала самые трудные</div>'+S.dict.map((w,i)=>({w,i,s:S.st["u:"+w.en]})).sort((a,b)=>acc(a.s)-acc(b.s)).map(({w,i,s})=>{const n=s?s.r+s.w:0,p=n?Math.round(s.r/n*100):0;return '<div class="item"><div style="flex:1;min-width:0"><b>'+esc(w.en)+'</b> <small>— '+esc(w.ru.join(", "))+'</small><div class="bar"><i style="width:'+p+'%;background:'+(p>=80?'var(--ok)':p>=50?'var(--fire)':'var(--bad)')+'"></i></div><small>'+(n?'✓ '+s.r+' · ✗ '+s.w+' · '+p+'% · подряд: '+s.run:'ещё не спрашивали')+'</small></div><button data-r="'+i+'" title="Сбросить статистику слова" style="color:var(--text);font-size:16px">↺</button><button data-s="'+i+'" title="Произнести" style="color:var(--text);font-size:16px">🔊</button><button data-i="'+i+'" title="Удалить">×</button></div>'}).join("");
  $("tl").textContent=$("list").classList.contains("hide")?"Показать список ("+S.dict.length+")":"Скрыть список";
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("list").onclick=e=>{const rr=e.target.dataset.r;if(rr!==undefined){const k="u:"+S.dict[+rr].en;delete S.st[k];delete S.wt[k];queue=queue.filter(x=>x.k!==k);save();renderList();return}const sp=e.target.dataset.s;if(sp!==undefined){say(S.dict[+sp].en,"en-GB");return}const i=e.target.dataset.i;if(i===undefined)return;delete S.st["u:"+S.dict[+i].en];S.dict.splice(+i,1);save();renderList();if(tab===1){reset();next()}};
$("add").onclick=()=>{
  const en=$("nw").value.trim(),ru=$("nt").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!en||!ru.length)return;
  S.dict=S.dict.filter(w=>w.en.toLowerCase()!==en.toLowerCase());S.dict.push({en,ru});
  $("nw").value="";$("nt").value="";save();renderList();if(tab===1&&(!cur||done))next();$("nw").focus()};
$("tl").onclick=()=>{$("list").classList.toggle("hide");renderList()};
$("nt").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
function setTab(t){save();tab=t;{const m=S.m[t];streak=m.streak||0;score=m.score||0;total=m.total||0}fire();reset();$("t1").className=t===0?"on":"";$("t2").className=t===1?"on":"";$("lvbox").classList.toggle("hide",t!==0);$("dp").classList.toggle("show",t===1);queue=[];next()}
function setDir(d){dir=d;$("d1").className=d===0?"on":"";$("d2").className=d===1?"on":"";next()}
$("t1").onclick=()=>setTab(0);$("t2").onclick=()=>setTab(1);$("d1").onclick=()=>setDir(0);$("d2").onclick=()=>setDir(1);
$("lv").innerHTML=L.map((l,i)=>'<button data-l="'+i+'">'+l+'</button>').join("");
function markLv(){[...$("lv").children].forEach((b,i)=>b.className=S.lvls.includes(i)?"on":"")}
const lvEl=$("lv");let ls=null;lvEl.style.touchAction="none";
function lvAt(x,y){const el=document.elementFromPoint(x,y),b=el&&el.closest?el.closest("[data-l]"):null;return b&&lvEl.contains(b)?+b.dataset.l:null}
function paint(){const lo=Math.min(ls.a,ls.b),hi=Math.max(ls.a,ls.b);[...lvEl.children].forEach((b,i)=>b.className=i>=lo&&i<=hi?"on":"")}
lvEl.onpointerdown=e=>{const i=lvAt(e.clientX,e.clientY);if(i===null)return;try{lvEl.setPointerCapture(e.pointerId)}catch(_){}ls={a:i,b:i};paint()};
lvEl.onpointermove=e=>{if(!ls)return;const i=lvAt(e.clientX,e.clientY);if(i!==null&&i!==ls.b){ls.b=i;paint()}};
const lvEnd=()=>{if(!ls)return;const lo=Math.min(ls.a,ls.b),hi=Math.max(ls.a,ls.b);S.lvls=[];for(let i=lo;i<=hi;i++)S.lvls.push(i);ls=null;save();markLv();queue=[];reset();next()};
lvEl.onpointerup=lvEnd;lvEl.onpointercancel=lvEnd;
if(!Array.isArray(S.lvls))S.lvls=[S.lvl??1];for(let i=0;i<3;i++)S.m[i]=S.m[i]||{};if(!S.m[0].best&&S.best)S.m[0].best=S.best;{const m=S.m[tab];streak=m.streak||0;score=m.score||0;total=m.total||0}
$("gear").onclick=()=>$("sp").classList.toggle("show");
{let t=null;const L0="Очистить весь словарь";$("cd").onclick=()=>{if(!t){$("cd").textContent="Точно? Нажмите ещё раз";t=setTimeout(()=>{t=null;$("cd").textContent=L0},3500);return}clearTimeout(t);t=null;$("cd").textContent=L0;S.dict=[];for(const k of Object.keys(S.st))if(k[0]==="u")delete S.st[k];for(const k of Object.keys(S.wt))if(k[0]==="u")delete S.wt[k];queue=[];save();renderList();reset();next()}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){$("warn").classList.remove("hide")}
window.addEventListener("storage",e=>{if(e.key==="wst2"&&e.newValue){try{const x=JSON.parse(e.newValue);S.dict=x.dict||[];S.st=x.st||{};S.wt=x.wt||{};S.best=x.best||0;renderList()}catch(_){}}});
$("bk").onclick=()=>{const h=$("bkb").classList.toggle("hide");if(!h)$("bt").value=JSON.stringify({dict:S.dict,st:S.st,wt:S.wt,m:S.m,lvls:S.lvls})};
$("bc").onclick=()=>{$("bt").select();try{navigator.clipboard.writeText($("bt").value)}catch(e){document.execCommand("copy")}};
$("br").onclick=()=>{try{const x=JSON.parse($("bt").value);if(!Array.isArray(x.dict))throw 0;S=Object.assign(S,x);save();renderList();markLv();reset();next();$("bt").value="";$("bkb").classList.add("hide")}catch(e){$("bt").value="Ошибка: вставьте сюда текст резервной копии"}};
markLv();renderList();fire();next();fillVo();
</script>
