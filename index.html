function vFrame(ts){vRaf=requestAnimationFrame(vFrame);const sc=$("scene");if(!sc||sc.classList.contains("hide")||document.hidden)return;const x0=sc.getBoundingClientRect().left;
  sc.querySelectorAll(".veh").forEach(v=>{const x=v.getBoundingClientRect().left-x0,st=v._s||(v._s={x:x,t:ts,vs:0}),dt=(ts-st.t)/1000;if(dt<=0)return;
    st.vs+=((x-st.x)/dt-st.vs)*Math.min(1,dt*20);st.x=x;st.t=ts;const g=Math.max(0,st.vs)+VC0;
    v.querySelectorAll(".wh").forEach(w=>{const r=+w.dataset.r,step=g/r*dt;w._a=((w._a||0)+step)%6.2832;w.style.transform="rotate("+(w._a*57.2958).toFixed(1)+"deg)";
      const k=Math.min(1,Math.max(0,(step-.55)/.7)),b=Math.min(1,Math.max(0,(step-.3)/.6));
      w.querySelectorAll(".hub").forEach(h=>h.style.opacity=(1-k).toFixed(2));w.querySelectorAll(".wb").forEach(h=>h.style.opacity=(.55*b).toFixed(2))});
    const f=v.querySelector(".flame");if(f){const q=Math.min(1.2,Math.max(0,st.vs)/600),fl=Math.sin(ts/40),sx=(.8+1.2*q)*(1+.04*fl);f.style.transform="scale("+sx.toFixed(3)+","+(.94+.05*fl).toFixed(3)+")";v._fx=-12.2*sx}
    if(v._T&&v._T.rc){const t=ts/1000,ph=v._ph||(v._ph=Math.random()*6.28),fd=1/(1+Math.max(0,st.vs)/160),
      bob=-(1.5*Math.sin(t*1.9+ph)+.5*Math.sin(t*3.1+ph*1.7))*fd,
      vy=-(1.5*1.9*Math.cos(t*1.9+ph)+.5*3.1*Math.cos(t*3.1+ph*1.7))*fd,
      pitch=Math.atan2(vy,v._vg||VC0)*57.2958-Math.min(1.2,Math.max(0,st.vs)/600)*5,
      sway=(9*Math.sin(t*1.45+ph*.7)+3*Math.sin(t*2.6+ph))*fd;
    (v._rl||(v._rl=v.querySelector(".rl"))).style.transform="translateY("+bob.toFixed(2)+"px) rotate("+pitch.toFixed(2)+"deg)";v._y=bob;
    const dx=parseFloat(sc.style.getPropertyValue("--dx"))||1,deg=720*Math.max(-1.2,Math.min(1.2,(x-v.offsetLeft)/dx))+sway;
    if(v._dg===undefined||Math.abs(deg-v._dg)>.25){v._dg=deg;rollDraw(v,deg)}}})}
const AN={car:"🏎 Гонки: болиды",plane:"✈️ Небо: самолёты",rocket:"🚀 Космос: ракеты",off:"⏹ Без анимации"};
$("an").innerHTML=Object.keys(AN).map(k=>'<option value="'+k+'">'+AN[k]+'</option>').join("");$("an").value=animTheme();
$("an").onchange=()=>{S.anim=$("an").value;save();vIdx=0;setScene();if(S.anim!=="off")setTimeout(()=>vehGo(true),350)};
markLv();renderList();fire();next();fillVo();if(!vRaf)vRaf=requestAnimationFrame(vFrame);setScene();
</script>
